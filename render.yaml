# Blueprint de Render: sitio estático generado con Astro.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: spanish-scattergories
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Astro 7 exige Node.js >= 22.23.4; Node 24 (LTS) cumple con margen.
      - key: NODE_VERSION
        value: "24"
      # URL pública: se usa en canonical, sitemap y Open Graph.
      # IMPORTANTE: compruébala tras el primer despliegue (Render puede
      # asignar otro subdominio) y cámbiala si usas un dominio propio.
      - key: SITE_URL
        value: https://spanish-scattergories.onrender.com
      - key: ASTRO_TELEMETRY_DISABLED
        value: "1"
    headers:
      # Archivos con hash o versión en el nombre: caché de un año.
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
